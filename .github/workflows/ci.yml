name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pre-commit/action@v3.0.1
      - name: Git whitespace
        run: git diff --check
      - name: Validate README artwork
        run: python3 -c 'import pathlib, xml.etree.ElementTree as ET; [ET.parse(path) for path in pathlib.Path("assets").glob("*.svg")]'
      - name: Verify public template path
        run: node tools/check-public-path.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "LeanBlog LeanBlog.Properties tests readme demo leanblog"
      - name: Generate Verso cross-reference index
        run: lake build :literateHtml
      - name: Run tests
        run: ./.lake/build/bin/tests
      - name: Verify README examples
        run: ./.lake/build/bin/readme >/dev/null
      - name: Render demo
        run: ./.lake/build/bin/demo >/dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Build Tailwind and daisyUI theme
        run: npm ci --prefix theme && npm run build:css --prefix theme
      - name: Verify collection prototype assets
        run: test -s theme/dist/site.css
      - name: Check and render example collection
        run: |
          rm -rf .lake/build/init-test
          ./.lake/build/bin/leanblog init .lake/build/init-test
          test -s .lake/build/init-test/posts/starter.lean.md
          test -s .lake/build/init-test/leanblog.json
          test -s .lake/build/init-test/.gitignore
          test -s .lake/build/init-test/lean-toolchain
          test -s .lake/build/init-test/lakefile.lean
          test -s .lake/build/init-test/Main.lean
          test -s .lake/build/init-test/theme/package.json
          test -s .lake/build/init-test/theme/package-lock.json
          test -s .lake/build/init-test/theme/src/app.css
          test -s .lake/build/init-test/tools/build-site.mjs
          test -s .lake/build/init-test/.github/workflows/pages.yml
          cp .lake/build/init-test/README.md .lake/build/init-test/README.before-rerun.md
          ./.lake/build/bin/leanblog init .lake/build/init-test >/dev/null
          cmp .lake/build/init-test/README.md .lake/build/init-test/README.before-rerun.md
          sed -i '/require leanblog from git/,+1c\require leanblog from "../../../"' \
            .lake/build/init-test/lakefile.lean
          (cd .lake/build/init-test && lake build leanblog-site)
          (cd .lake/build/init-test && npm ci --prefix theme && node tools/build-site.mjs)
          ./.lake/build/bin/leanblog check site/posts
          ./.lake/build/bin/leanblog build site/posts
          node tools/check-site.mjs .lake/build/site
          node tools/check-search.mjs .lake/build/site
          ./.lake/build/bin/leanblog check test/fixtures/posts
          ./.lake/build/bin/leanblog build test/fixtures/posts \
            --output .lake/build/fixture-site \
            --xref test/fixtures/xref.json
          node tools/check-site.mjs .lake/build/fixture-site
          node tools/check-search.mjs .lake/build/fixture-site test/fixtures/search.json
          node --check --input-type=module < .lake/build/site/-verso-search/search-init.js
      - name: Install Chromium for browser smoke tests
        run: npm exec --prefix theme -- playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tools/browser-smoke.mjs .lake/build/fixture-site

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-pages-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-pages-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-pages-${{ runner.os }}-
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: "LeanBlog LeanBlog.Properties tests readme demo leanblog"
      - name: Generate Verso cross-reference index
        run: lake build :literateHtml
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Build Tailwind and daisyUI theme
        run: npm ci --prefix theme && npm run build:css --prefix theme
      - name: Build and audit Pages site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          docs_root="${PAGES_BASE_PATH}/api"
          ./.lake/build/bin/leanblog check site/posts
          ./.lake/build/bin/leanblog build site/posts \
            --output .lake/build/pages \
            --docs-root "$docs_root" \
            --docs-directory api
          node tools/check-site.mjs .lake/build/pages
          node tools/check-search.mjs .lake/build/pages
          node --check --input-type=module < .lake/build/pages/-verso-search/search-init.js
          DOCS_ROOT="$docs_root" python3 - <<'PY'
          from pathlib import Path
          import os

          api = Path('.lake/build/pages/api')
          assert api.is_dir() and any(api.rglob('index.html'))
          posts = [p for p in Path('.lake/build/pages').rglob('index.html')
                   if 'class="post-page"' in p.read_text()]
          assert posts and any(os.environ['DOCS_ROOT'] in p.read_text() for p in posts)
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .lake/build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

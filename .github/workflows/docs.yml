name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure ecosystem dependency access
        env:
          ECOSYSTEM_READ_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: |
          test -n "$ECOSYSTEM_READ_TOKEN"
          git config --global url."https://x-access-token:${ECOSYSTEM_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-pages-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-pages-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-pages-${{ runner.os }}-
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: "LeanBlog LeanBlog.Properties tests readme demo leanblog"
      - name: Generate Verso cross-reference index
        run: lake build :literateHtml
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Build Tailwind and daisyUI theme
        run: npm ci --prefix theme && npm run build:css --prefix theme
      - name: Build Pages site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          docs_root="${PAGES_BASE_PATH}/api"
          ./.lake/build/bin/leanblog check examples/posts
          ./.lake/build/bin/leanblog build examples/posts \
            --output .lake/build/pages \
            --docs-root "$docs_root" \
            --docs-directory api
          test -s .lake/build/pages/index.html
          test -s .lake/build/pages/api/LeanBlog/Markdown/index.html
          test -s .lake/build/pages/2026-8-3-sum-a-small-algebra-of-choices/index.html
          test -s .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          test -s .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/raw/index.html
          test -s .lake/build/pages/tutorial/index.html
          grep -q "$docs_root/LeanBlog/Markdown/#LeanBlog___PostSource" .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'href="2026-8-3-sum-a-small-algebra-of-choices/"' .lake/build/pages/2026-8-2-using-sum-in-another-post/index.html
          grep -q 'href="2026-8-2-using-sum-in-another-post/"' .lake/build/pages/2026-8-3-sum-a-small-algebra-of-choices/index.html
          grep -q 'title="Declaration from `Sum, a small algebra of choices`"' .lake/build/pages/2026-8-2-using-sum-in-another-post/index.html
          grep -q 'class="leanblog-related"' .lake/build/pages/2026-8-2-using-sum-in-another-post/index.html
          grep -q 'class="related-card-body"' .lake/build/pages/2026-8-2-using-sum-in-another-post/index.html
          grep -q 'class="site-header"' .lake/build/pages/index.html
          grep -q 'class="post-list"' .lake/build/pages/index.html
          grep -q 'class="post-entry-row"' .lake/build/pages/index.html
          ! grep -q 'class="post-entry-author"' .lake/build/pages/index.html
          grep -q 'class="post-title"' .lake/build/pages/2026-8-7-a-leanblog-post/index.html
          grep -q 'data-post-toc' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'data-post-toc-depth="3"' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'class="leanblog-code"' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'data-code-source' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'data-code-copy' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'addLineNumbers' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'Greeting.lean' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'class="raw-source-code"' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/raw/index.html
          grep -q 'data-share-post' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'data-print-post' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'class="post-layout"' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          ! grep -q '<details class="post-toc"' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'buildTableOfContents' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'Source model' .lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html
          grep -q 'Display mathematics' .lake/build/pages/2026-8-4-markdown-math-and-diagrams/index.html
          ! grep -q 'drawer lg:drawer-open' .lake/build/pages/2026-8-7-a-leanblog-post/index.html
          ! grep -q 'In this collection' .lake/build/pages/2026-8-7-a-leanblog-post/index.html
          ! grep -q 'A LeanBlog post</p>' .lake/build/pages/2026-8-7-a-leanblog-post/index.html
          ! grep -R -q 'href="../2026-' .lake/build/pages --include='index.html'
          python3 - <<'PY'
          from pathlib import Path

          html = Path('.lake/build/pages/index.html').read_text()
          assert 'class="site-topic-links"' not in html
          assert 'href="tutorial/"' not in html
          PY
      - name: Validate generated theme scripts
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(
            ".lake/build/pages/2026-8-6-how-a-leanblog-post-is-built/index.html",
            "utf8"
          );
          const match = html.match(
            /<script>\s*\(\(\) => \{[\s\S]*?\n\}\)\(\);\s*<\/script>/
          );
          if (!match) throw new Error("theme script missing");
          new Function(match[0].replace(/^<script>|<\/script>$/g, ""));
          NODE
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .lake/build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
